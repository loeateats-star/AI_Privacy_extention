<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>PromptGuard</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      width: 260px;
      margin: 0;
      padding: 12px;
    }
    h1 {
      font-size: 18px;
      margin: 0 0 4px 0;
    }
    #total {
      margin: 0 0 10px 0;
      color: gray;
    }
    table {
      width: 100%;
      border-collapse: collapse;
    }
    td {
      padding: 4px 0;
      border-top: 1px solid #ddd;
    }
    td.count {
      text-align: right;
      font-weight: bold;
    }
    button {
      margin-top: 10px;
      width: 100%;
    }
  </style>
</head>
<body>
  <h1>PromptGuard</h1>
  <p id="total">Total flagged: 0</p>

  <table id="counts"></table>

  <button id="reset">Reset counts</button>

  <script src="../src/detectors.js"></script>
  <script src="popup.js"></script>
</body>
</html>
